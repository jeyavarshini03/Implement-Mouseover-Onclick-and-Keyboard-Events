<!DOCTYPE html>
<html>
<head>
    <title>Events Handling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h2 id="heading" onmouseover="changeColor()">
            Move Mouse Over Me
        </h2>

        <button onclick="showMessage()">
            Click Me
        </button>

        <br><br>

        <input type="text"
               id="textbox"
               placeholder="Type Something"
               onkeyup="displayText()">

        <p id="output"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
